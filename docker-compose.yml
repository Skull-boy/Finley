services:
  mongodb:
    image: mongo:7.0
    container_name: finbot_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # localhost only — requires auth anyway
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-finbot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-finbot_dev_password}
      MONGO_INITDB_DATABASE: finbot

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: finbot_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"     # localhost only — requires API key anyway
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}

volumes:
  mongo_data:
  qdrant_data: