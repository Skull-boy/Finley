version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: finbot_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: finbot

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: finbot_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
